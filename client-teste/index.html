<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Back-end Test - Food Critic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🛠️ Painel de Teste (Back-end)</h1>
        <p>Use este painel para validar o Banco de Dados e o Storage.</p>

        <!-- LOGIN / CADASTRO -->
        <div id="auth-section" class="card">
            <h2>1. Autenticação</h2>
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="password" placeholder="Senha">
            <button onclick="signup()" class="btn-secondary">Cadastrar</button>
            <button onclick="login()">Entrar</button>
        </div>

        <!-- APP (Só aparece logado) -->
        <div id="app-section" style="display:none;">
            <div class="card">
                <h2>Logado como: <span id="user-email"></span></h2>
                <button onclick="logout()" class="btn-danger">Sair</button>
                <button onclick="prepararDadosTeste()" class="btn-warning">Preparar Dados de Teste (Restaurante e Preferência)</button>
            </div>

            <div class="card">
                <h2>2. Testar Upload e Insert (Review)</h2>
                <label>Foto da Comida:</label>
                <input type="file" id="food-photo" accept="image/*">
                
                <label>Nota (1 a 5):</label>
                <input type="number" id="rating" value="5" min="1" max="5">
                
                <label>Preço Pago (R$):</label>
                <input type="number" id="price" value="35.50" step="0.01">
                
                <label>Resenha:</label>
                <textarea id="review-text">Comida excelente, recomendo!</textarea>

                <button onclick="testarReview()" class="btn-success">Enviar Review e Testar Banco</button>
            </div>

            <div class="card">
                <h2>3. Testar Motor de Recomendação (RPC)</h2>
                <p>Chama a função SQL <code>get_recommendations_for_user</code>.</p>
                <button onclick="testarRecomendacao()">Buscar Recomendações</button>
                <pre id="resultado-rpc"></pre>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
