<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - FoodCritic</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div id="toast-container" class="toast-container"></div>

    <div class="login-container">
        <!-- Imagem de Capa -->
        <div class="login-hero">
            <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Comida">
            <div class="login-hero-overlay"></div>
        </div>

        <!-- Conteúdo do Login -->
        <div class="login-content">
            <h1 class="login-logo">Food<span>Critic</span></h1>
            <h2 class="login-title">Fotografe. Avalie. Descubra.</h2>
            <p class="login-subtitle">Seu diário de comida que aprende o que você gosta.</p>

            <!-- Botões Sociais -->
            <div class="social-login-group">
                <button class="btn-social btn-google" onclick="alert('Login com Google em breve!')">
                    <i class="fab fa-google"></i> Continuar com Google
                </button>
                <button class="btn-social btn-apple" onclick="alert('Login com Apple em breve!')">
                    <i class="fab fa-apple"></i> Continuar com Apple
                </button>
            </div>

            <div class="login-divider">
                <span>ou</span>
            </div>

            <!-- Formulário de E-mail -->
            <div class="login-form">
                <div class="input-icon-group">
                    <i class="far fa-envelope"></i>
                    <input type="email" id="auth-email" placeholder="Seu e-mail">
                </div>
                <div class="input-icon-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="auth-password" placeholder="Sua senha">
                </div>
                
                <button class="btn-auth-primary" onclick="fazerLogin()">Entrar com e-mail</button>
            </div>

            <!-- Rodapé -->
            <p class="login-footer">
                Ainda não tem conta? <a href="register.html">Criar conta</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
</body>
</html>
